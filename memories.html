<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Us❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="paper-body">

    <main class="scrapbook-page">

        <!-- SMALL TEXT -->
        <p class="little-note">
            Actually, we need like 1000 pictures because finding these
            was so hard and it shouldn't be 😭
        </p>


        <!-- MAIN TITLE -->
        <h1>
            But anyway...
            <br>
            I loved these
        </h1>

        <p class="scrapbook-subtitle">
            little pieces of us
        </p>


        <!-- DECORATIONS -->
        <div class="scrapbook-decoration deco-heart">
            ♡
        </div>

        <div class="scrapbook-decoration deco-flower">
            ❀
        </div>


        <!-- ================================
             SLIDESHOW
             ================================ -->

        <div class="slideshow-container">


            <!-- PICTURE 1 -->

            <div class="slide active">

                <div class="polaroid rotate-left">

                    <img src="IMAGES/pic1.jpg" alt="Us">

                    <p>
                        one of my favourites ♡
                    </p>

                </div>

            </div>


            <!-- PICTURE 2 -->

            <div class="slide">

                <div class="polaroid rotate-right">

                    <img src="IMAGES/pic2.jpg" alt="Us">

                    <p>
                        my favourite person 😍
                    </p>

                </div>

            </div>


            <!-- PICTURE 3 -->

            <div class="slide">

                <div class="polaroid rotate-left">

                    <img src="IMAGES/pic3.jpg" alt="Us">

                    <p>
                        us &gt;&gt;&gt;
                    </p>

                </div>

            </div>


            <!-- ONLY VIDEO -->

            <div class="slide">

                <div class="polaroid rotate-right">

                    <video controls playsinline>

                        <source
                            src="VIDEOS/vid1.mp4"
                            type="video/mp4"
                        >

                        Your browser does not support this video.

                    </video>

                    <p>
                        Couldn't miss this.
                    </p>

                </div>

            </div>


            <!-- LEFT ARROW -->

            <button
                class="prev"
                onclick="changeSlide(-1)"
                aria-label="Previous"
            >
                ‹
            </button>


            <!-- RIGHT ARROW -->

            <button
                class="next"
                onclick="changeSlide(1)"
                aria-label="Next"
            >
                ›
            </button>

        </div>


        <!-- ================================
             DOTS
             ================================ -->

        <div class="slide-dots">

            <span
                class="dot active-dot"
                onclick="goToSlide(0)">
            </span>

            <span
                class="dot"
                onclick="goToSlide(1)">
            </span>

            <span
                class="dot"
                onclick="goToSlide(2)">
            </span>

            <span
                class="dot"
                onclick="goToSlide(3)">
            </span>

        </div>


        <!-- ================================
             BOTTOM
             ================================ -->

        <div class="memories-bottom">

            <a href="letter.html">
                ← back to the letter
            </a>

            <a href="final.html" class="final-link">
                one last thing →
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
